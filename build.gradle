plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.nmcp.gradle.plugin)
    alias(libs.plugins.spotless.plugin.gradle)
}

group = "$groupPackage" as Object
version = "$projectVersion" as Object
description = "$projectDescription"

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of("$projectSourceCompatibility")
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

gradlePlugin {
    website = "$projectScmProviderUrl$projectHolderUsername/$rootProject.name"
    vcsUrl = "$projectScmProviderUrl$projectHolderUsername/${rootProject.name}.git"
    plugins {
        ownDisplay {
            id = 'io.github.astrapi69.own-display'
            implementationClass = 'io.github.astrapi69.own.display.OwnDisplayPlugin'
            displayName = 'own-display'
            description = "Runs every test task on a display of the build's own: an Xvfb with a " +
                "window manager, measured, never the desktop's"
        }
        testResultsComplete {
            id = 'io.github.astrapi69.test-results-complete'
            implementationClass = 'io.github.astrapi69.test.results.complete.TestResultsCompletePlugin'
            displayName = 'test-results-complete'
            description = "After each test task, every compiled test class must have left a result in the task's " +
                "JUnit XML, or the build fails and names the classes: a test that ends the test JVM with " +
                "System.exit can no longer end the task green over classes that never ran"
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // The tests of this plugin open no window. They decide the DISPLAY of every process they start,
    // and none of them inherits the one this build was started with, which on a desktop is the
    // person's real screen (astrapi69/mystic-crypt-ui#504)
    environment.remove('DISPLAY')
    systemProperty 'functionalTestGradleVersions', functionalTestGradleVersions
    // PublicationPomFunctionalTest generates the POMs from a copy of this build's own files (#14):
    // they are what it checks, so a change to them runs it again
    inputs.files('settings.gradle', 'build.gradle', 'gradle.properties', 'gradle')
        .withPropertyName('buildFilesOfThePublications')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    testLogging {
        events "failed"
        exceptionFormat "full"
    }
}

jar {
    manifest {
        attributes(
            "Implementation-Title": "$groupPackage.$rootProject.name",
            "Implementation-Version": project.version,
            "Implementation-Vendor": "$projectLeaderName"
        )
    }
}

apply from: "gradle/formatting.gradle"
apply from: "gradle/publishing.gradle"
